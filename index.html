<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ROYAL MOD - Giveaway</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #020617,
      #0f172a,
      #172554
    );

  color: white;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

}


.container {

  width: 100%;

  max-width: 470px;

}


.card {

  background:
    rgba(15, 23, 42, 0.96);

  border:
    1px solid
    rgba(255,255,255,0.08);

  border-radius: 22px;

  padding: 30px 24px;

  text-align: center;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,0.45);

}


.logo {

  width: 90px;

  height: 90px;

  object-fit: cover;

  border-radius: 50%;

  margin-bottom: 12px;

}


h1 {

  margin: 5px 0;

  font-size: 28px;

  letter-spacing: 1px;

}


.subtitle {

  color: #cbd5e1;

  margin-bottom: 22px;

  font-size: 16px;

}


.counter {

  font-size: 22px;

  font-weight: bold;

  margin: 18px 0;

  color: #60a5fa;

}


input {

  width: 100%;

  padding: 14px;

  margin: 8px 0;

  border-radius: 12px;

  border: 1px solid #334155;

  background: #020617;

  color: white;

  font-size: 15px;

  outline: none;

}


input:focus {

  border-color: #60a5fa;

}


button {

  width: 100%;

  padding: 14px;

  margin-top: 12px;

  border: none;

  border-radius: 12px;

  background:
    linear-gradient(
      90deg,
      #2563eb,
      #7c3aed
    );

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


button:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}


.message {

  margin-top: 15px;

  min-height: 24px;

  font-size: 14px;

  color: #cbd5e1;

}


.complete {

  display: none;

  margin-top: 22px;

  padding: 18px;

  border-radius: 16px;

  background:
    rgba(34,197,94,0.12);

  border:
    1px solid
    rgba(34,197,94,0.35);

}


.complete-title {

  font-size: 21px;

  font-weight: bold;

  color: #86efac;

}


.complete-text {

  margin-top: 8px;

  color: #cbd5e1;

}


.winners-box {

  display: none;

  margin-top: 20px;

  padding: 18px;

  border-radius: 16px;

  background:
    rgba(250,204,21,0.08);

  border:
    1px solid
    rgba(250,204,21,0.3);

}


.winners-title {

  font-size: 21px;

  font-weight: bold;

  margin-bottom: 14px;

}


.winner-item {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 12px;

  margin: 8px 0;

  background:
    rgba(255,255,255,0.05);

  border-radius: 12px;

  text-align: left;

}


.winner-number {

  width: 32px;

  height: 32px;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #facc15;

  color: #111827;

  font-weight: bold;

  flex-shrink: 0;

}


.winner-name {

  font-weight: bold;

  font-size: 16px;

  color: white;

}


.footer {

  margin-top: 20px;

  font-size: 12px;

  color: #64748b;

}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <img
      src="royal-mod.png"
      class="logo"
      alt="ROYAL MOD"
    >

    <h1>ROYAL MOD</h1>

    <div class="subtitle">
      7 Day VIP Access Giveaway
    </div>


    <div
      class="counter"
      id="counter"
    >
      0 / 200
    </div>


    <form id="giveawayForm">

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <input
        type="text"
        id="telegramId"
        placeholder="Enter Telegram username"
        required
      >

      <button
        type="submit"
        id="submitBtn"
      >
        Enter Giveaway
      </button>

    </form>


    <div
      class="message"
      id="message"
    ></div>


    <div
      class="complete"
      id="completeBox"
    >

      <div class="complete-title">
        🎉 Giveaway Complete!
      </div>

      <div class="complete-text">
        200 entries complete.
      </div>

    </div>


    <div
      class="winners-box"
      id="winnersBox"
    >

      <div class="winners-title">
        🏆 Giveaway Winners
      </div>

      <div id="winnersList"></div>

    </div>


    <div class="footer">
      © ROYAL MOD
    </div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw4VrrwZnmS0JXBtoeb4lR3KWJJeae6UgayRjgtEnyO9UsFuUzCXOBmL7X1qiWNZBCR/exec";


const form =
  document.getElementById("giveawayForm");

const nameInput =
  document.getElementById("name");

const telegramInput =
  document.getElementById("telegramId");

const submitBtn =
  document.getElementById("submitBtn");

const message =
  document.getElementById("message");

const counter =
  document.getElementById("counter");

const completeBox =
  document.getElementById("completeBox");

const winnersBox =
  document.getElementById("winnersBox");

const winnersList =
  document.getElementById("winnersList");


// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


// ========================================
// SHOW WINNERS
// ONLY NAME
// ========================================

function showWinners(winners) {

  if (
    !Array.isArray(winners) ||
    winners.length === 0
  ) {

    winnersBox.style.display = "none";

    return;

  }


  winnersList.innerHTML = "";


  winners.forEach(
    function(winner, index) {

      const item =
        document.createElement("div");

      item.className =
        "winner-item";


      item.innerHTML = `

        <div class="winner-number">
          ${index + 1}
        </div>

        <div class="winner-name">
          ${escapeHTML(winner.name)}
        </div>

      `;


      winnersList.appendChild(item);

    }
  );


  winnersBox.style.display = "block";

}


// ========================================
// API REQUEST
// ========================================

function requestAPI(params) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement("script");


      const query =
        new URLSearchParams({
          ...params,
          callback: callbackName
        });


      const timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                "Request timeout"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(timeout);

        if (
          window[callbackName]
        ) {

          delete window[callbackName];

        }

        script.remove();

      }


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);

        };


      script.src =
        API_URL +
        "?" +
        query.toString();


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              "Connection error"
            )
          );

        };


      document.body.appendChild(script);

    }
  );

}


// ========================================
// UPDATE STATUS
// ========================================

function updateStatus(data) {

  if (!data) return;


  const count =
    Math.min(
      Number(data.count || 0),
      200
    );


  counter.textContent =
    count + " / 200";


  if (data.completed) {

    completeBox.style.display =
      "block";

    submitBtn.disabled =
      true;

    nameInput.disabled =
      true;

    telegramInput.disabled =
      true;


    // Winners included directly
    if (
      Array.isArray(data.winners)
    ) {

      showWinners(
        data.winners
      );

    }

    // Also request latest winners
    loadWinners();

  } else {

    completeBox.style.display =
      "none";

  }

}


// ========================================
// LOAD WINNERS
// ========================================

async function loadWinners() {

  try {

    const data =
      await requestAPI({
        action: "winners"
      });


    if (
      data &&
      Array.isArray(data.winners)
    ) {

      showWinners(
        data.winners
      );

    }

  } catch (error) {

    console.log(
      "Winner loading error:",
      error
    );

  }

}


// ========================================
// LOAD COUNT
// ========================================

async function loadCount() {

  try {

    const data =
      await requestAPI({});


    if (data) {

      updateStatus(data);

    }

  } catch (error) {

    console.log(
      "Status loading error:",
      error
    );

  }

}


// ========================================
// FORM SUBMIT
// ========================================

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const name =
      nameInput.value.trim();

    const telegramId =
      telegramInput.value
        .trim()
        .replace(/^@/, "");


    if (!name || !telegramId) {

      message.textContent =
        "Name aur Telegram ID dono enter karo.";

      return;

    }


    submitBtn.disabled =
      true;

    message.textContent =
      "Submitting...";


    try {

      const data =
        await requestAPI({
          name: name,
          telegramId: telegramId
        });


      if (data.success) {

        message.textContent =
          data.message ||
          "Entry successfully submitted!";


        nameInput.value = "";

        telegramInput.value = "";


        updateStatus(data);


        if (data.completed) {

          showWinners(
            data.winners || []
          );

        }

      } else {

        message.textContent =
          data.message ||
          "Something went wrong.";


        if (
          data.count !== undefined
        ) {

          counter.textContent =
            Math.min(
              Number(data.count),
              200
            ) +
            " / 200";

        }

      }

    } catch (error) {

      console.log(error);

      message.textContent =
        "Connection error. Please try again.";

    }


    if (
      !completeBox ||
      completeBox.style.display !==
      "block"
    ) {

      submitBtn.disabled =
        false;

    }

  }
);


// ========================================
// INITIAL LOAD
// ========================================

loadCount();


// ========================================
// CHECK EVERY 10 SECONDS
// ========================================

setInterval(
  loadCount,
  10000
);

</script>

</body>

</html>
