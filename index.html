<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ROYAL MOD - 7 Day VIP Access Giveaway</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #172554 0%,
      #07111f 45%,
      #020617 100%
    );

  color: #fff;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;
}


.container {

  width: 100%;

  max-width: 440px;
}


.card {

  background:
    rgba(15,23,42,.97);

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius: 24px;

  padding: 30px 24px;

  text-align: center;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.45);
}


.logo {

  width: 92px;

  height: 92px;

  border-radius: 50%;

  object-fit: cover;

  display: block;

  margin:
    0 auto 15px;

  border:
    3px solid
    rgba(255,255,255,.15);
}


.brand {

  font-size: 28px;

  font-weight: 800;

  letter-spacing: 1px;

  margin-bottom: 6px;
}


.subtitle {

  color: #94a3b8;

  font-size: 14px;

  margin-bottom: 24px;
}


.giveaway-title {

  font-size: 22px;

  font-weight: 700;

  margin-bottom: 18px;
}


.counter-box {

  background:
    rgba(30,41,59,.85);

  border-radius: 16px;

  padding: 16px;

  margin-bottom: 22px;

  border:
    1px solid
    rgba(255,255,255,.06);
}


.counter {

  font-size: 30px;

  font-weight: 800;

  margin-bottom: 5px;
}


.counter-label {

  color: #94a3b8;

  font-size: 13px;
}


.input-group {

  text-align: left;

  margin-bottom: 16px;
}


.input-group label {

  display: block;

  font-size: 14px;

  font-weight: 600;

  margin-bottom: 8px;
}


.input-group input {

  width: 100%;

  height: 52px;

  padding: 0 15px;

  border-radius: 13px;

  border:
    1px solid
    #334155;

  outline: none;

  background:
    #0f172a;

  color: #fff;

  font-size: 15px;
}


.input-group input:focus {

  border-color:
    #3b82f6;

  box-shadow:
    0 0 0 3px
    rgba(59,130,246,.12);
}


.submit-btn {

  width: 100%;

  height: 53px;

  border: none;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  color: white;

  font-size: 16px;

  font-weight: 700;

  cursor: pointer;
}


.submit-btn:disabled {

  opacity: .6;

  cursor: not-allowed;
}


#message {

  min-height: 22px;

  margin-top: 15px;

  font-size: 14px;
}


#message.success {

  color:
    #4ade80;
}


#message.error {

  color:
    #f87171;
}


.complete-box {

  display: none;

  padding: 22px 15px;

  border-radius: 16px;

  background:
    rgba(22,101,52,.15);

  border:
    1px solid
    rgba(74,222,128,.2);
}


.complete-icon {

  font-size: 38px;

  margin-bottom: 10px;
}


.complete-title {

  font-size: 20px;

  font-weight: 700;

  color: #86efac;

  margin-bottom: 6px;
}


.complete-text {

  color: #94a3b8;

  font-size: 13px;

  line-height: 1.5;
}


/* =========================
   WINNERS
   ========================= */

.winners-box {

  display: none;

  margin-top: 18px;

  padding: 18px;

  border-radius: 16px;

  background:
    rgba(30,41,59,.95);

  border:
    1px solid
    rgba(251,191,36,.35);
}


.winners-title {

  font-size: 21px;

  font-weight: 800;

  color:
    #fbbf24;

  margin-bottom: 14px;
}


.winner-item {

  background:
    #0f172a;

  border:
    1px solid
    #334155;

  border-radius: 12px;

  padding: 13px;

  margin-top: 9px;

  text-align: left;
}


.winner-number {

  color:
    #fbbf24;

  font-weight: 800;

  margin-right: 6px;
}


.winner-name {

  color: white;

  font-weight: 700;
}


.winner-telegram {

  color:
    #94a3b8;

  font-size: 12px;

  margin-top: 4px;

  padding-left: 28px;
}


.footer {

  margin-top: 22px;

  color:
    #64748b;

  font-size: 12px;

  line-height: 1.5;
}


@media (max-width:480px) {

  body {
    padding: 14px;
  }

  .card {
    padding: 26px 18px;
  }

  .brand {
    font-size: 25px;
  }

}

</style>

</head>


<body>


<div class="container">


<div class="card">


<img
  src="royal-mod.png"
  alt="ROYAL MOD"
  class="logo"
>


<div class="brand">
ROYAL MOD
</div>


<div class="subtitle">
Official Giveaway
</div>


<div class="giveaway-title">
🎉 7 Day Vip Access Giveaway
</div>


<div class="counter-box">

<div class="counter">

<span id="count">0</span>/200

</div>

<div class="counter-label">
Entries Submitted
</div>

</div>


<form id="giveawayForm">


<div class="input-group">

<label for="name">
Name
</label>

<input
  type="text"
  id="name"
  placeholder="Enter your name"
  maxlength="50"
  required
>

</div>


<div class="input-group">

<label for="telegramId">
Telegram ID
</label>

<input
  type="text"
  id="telegramId"
  placeholder="@username"
  maxlength="50"
  required
>

</div>


<button
  type="submit"
  id="submitBtn"
  class="submit-btn"
>
Submit Entry
</button>


<div id="message"></div>


</form>


<div
  id="completeBox"
  class="complete-box"
>

<div class="complete-icon">
🎉
</div>

<div class="complete-title">
Giveaway Complete!
</div>

<div class="complete-text">
200 entries have been received.
The winners have been selected below.
</div>

</div>


<div
  id="winnersBox"
  class="winners-box"
>

<div class="winners-title">
🏆 Giveaway Winners
</div>

<div id="winnersList"></div>

</div>


<div class="footer">

ROYAL MOD © 2026

<br>

Giveaway entries are limited to one per Telegram ID.

</div>


</div>

</div>


<script>


/* ==========================================
   API
   ========================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbw4VrrwZnmS0JXBtoeb4lR3KWJJeae6UgayRjgtEnyO9UsFuUzCXOBmL7X1qiWNZBCR/exec";


const form =
document.getElementById(
  "giveawayForm"
);


const message =
document.getElementById(
  "message"
);


const button =
document.getElementById(
  "submitBtn"
);


const countElement =
document.getElementById(
  "count"
);


const completeBox =
document.getElementById(
  "completeBox"
);


const winnersBox =
document.getElementById(
  "winnersBox"
);


const winnersList =
document.getElementById(
  "winnersList"
);


/* ==========================================
   HTML ESCAPE
   ========================================== */

function escapeHTML(value) {

return String(value || "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* ==========================================
   SHOW WINNERS
   ========================================== */

function showWinners(winners) {


if (
  !Array.isArray(winners) ||
  winners.length === 0
) {

  return;

}


winnersList.innerHTML = "";


winners.forEach(
function(winner,index) {


const item =
document.createElement(
  "div"
);


item.className =
"winner-item";


item.innerHTML =

'<span class="winner-number">' +

"#" +
(index + 1) +

"</span>" +

'<span class="winner-name">' +

escapeHTML(
  winner.name
) +

"</span>" +

'<div class="winner-telegram">' +

escapeHTML(
  winner.telegramId
) +

"</div>";


winnersList.appendChild(
item
);


}
);


winnersBox.style.display =
"block";

}


/* ==========================================
   REQUEST WINNERS DIRECTLY
   ========================================== */

async function loadWinners() {


try {


const data =
await requestAPI({
  action: "winners"
});


if (
  data &&
  data.winners
) {

showWinners(
  data.winners
);

}


} catch(error) {

console.log(
  "Winner loading error:",
  error
);

}

}


/* ==========================================
   UPDATE STATUS
   ========================================== */

function updateStatus(data) {


if (!data) {
return;
}


if (
  data.count !== undefined
) {

countElement.textContent =
Math.min(
  Number(data.count) || 0,
  200
);

}


if (
  data.completed === true ||
  Number(data.count) >= 200
) {


form.style.display =
"none";


completeBox.style.display =
"block";


/*
 * IMPORTANT:
 * Fetch winners separately.
 */

loadWinners();


if (
  data.winners &&
  data.winners.length
) {

showWinners(
  data.winners
);

}

}

}


/* ==========================================
   JSONP
   ========================================== */

function requestAPI(params) {


return new Promise(
function(resolve,reject) {


const callbackName =

"royalModCallback_" +

Date.now() +

"_" +

Math.floor(
Math.random() * 1000000
);


const script =
document.createElement(
"script"
);


const query =
new URLSearchParams();


Object.keys(
params || {}
).forEach(
function(key) {

query.set(
key,
params[key]
);

}
);


query.set(
"callback",
callbackName
);


script.src =
API_URL +
"?" +
query.toString();


let finished =
false;


function cleanup() {


if (finished) {
return;
}


finished = true;


delete window[
callbackName
];


if (
script.parentNode
) {

script.parentNode
.removeChild(
script
);

}

}


window[
callbackName
] =
function(data) {

cleanup();

resolve(data);

};


script.onerror =
function() {

cleanup();

reject(
new Error(
"Connection failed"
)
);

};


document.body.appendChild(
script
);


setTimeout(
function() {


if (!finished) {


cleanup();


reject(
new Error(
"Request timeout"
)
);

}


},
15000
);


}
);

}


/* ==========================================
   LOAD COUNT
   ========================================== */

async function loadCount() {


try {


const data =
await requestAPI({});


updateStatus(
data
);


} catch(error) {


console.log(
"Count error:",
error
);

}

}


/* ==========================================
   SUBMIT
   ========================================== */

form.addEventListener(
"submit",
async function(event) {


event.preventDefault();


const name =
document
.getElementById("name")
.value
.trim();


const telegramId =
document
.getElementById("telegramId")
.value
.trim();


if (!name) {


message.textContent =
"Please enter your name.";


message.className =
"error";


return;

}


if (!telegramId) {


message.textContent =
"Please enter your Telegram ID.";


message.className =
"error";


return;

}


button.disabled =
true;


button.textContent =
"Submitting...";


message.textContent =
"";


try {


const data =
await requestAPI({

name:
name,

telegramId:
telegramId

});


if (
data &&
data.success
) {


message.textContent =
data.message ||
"Entry successfully submitted!";


message.className =
"success";


updateStatus(
data
);


form.reset();


if (
data.completed
) {


button.disabled =
true;


button.textContent =
"Giveaway Complete";


} else {


button.disabled =
false;


button.textContent =
"Submit Entry";

}


} else {


message.textContent =

(
data &&
data.message
) ||

"Unable to submit entry.";


message.className =
"error";


if (
data &&
data.count !== undefined
) {

countElement.textContent =
Math.min(
Number(data.count) || 0,
200
);

}


button.disabled =
false;


button.textContent =
"Submit Entry";

}


} catch(error) {


console.log(
"Submit error:",
error
);


message.textContent =
"Connection error. Please try again.";


message.className =
"error";


button.disabled =
false;


button.textContent =
"Submit Entry";

}


}
);


/* ==========================================
   START
   ========================================== */

loadCount();


/*
 * Check every 10 seconds.
 */

setInterval(
loadCount,
10000
);


</script>


</body>

</html>
