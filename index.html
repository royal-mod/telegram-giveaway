<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbyMahRSjdiXVNVSwFz9USfBNqg8ItHXNx9iBqeR39b55Rly9r97W5CvzIzv-06cPktp/exec";


const form =
  document.getElementById("giveawayForm");

const message =
  document.getElementById("message");

const button =
  document.getElementById("submitBtn");

const countElement =
  document.getElementById("count");

const completeBox =
  document.getElementById("completeBox");


// ==========================================
// UPDATE STATUS
// ==========================================

function updateStatus(data) {

  if (!data || !data.success) {
    return;
  }

  const count =
    Number(data.count || 0);

  countElement.textContent =
    Math.min(count, 200);


  if (
    data.completed ||
    count >= 200
  ) {

    form.style.display =
      "none";

    completeBox.style.display =
      "block";

  }

}


// ==========================================
// JSONP REQUEST
// ==========================================

function requestAPI(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "royalModCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    const script =
      document.createElement("script");


    const query =
      new URLSearchParams(params);


    query.set(
      "callback",
      callbackName
    );


    script.src =
      API_URL +
      "?" +
      query.toString();


    window[callbackName] =
      function(data) {

        delete window[callbackName];

        script.remove();

        resolve(data);

      };


    script.onerror =
      function() {

        delete window[callbackName];

        script.remove();

        reject(
          new Error(
            "Connection failed"
          )
        );

      };


    document.body.appendChild(
      script
    );


    // Timeout
    setTimeout(
      function() {

        if (
          window[callbackName]
        ) {

          delete window[callbackName];

          script.remove();

          reject(
            new Error(
              "Request timeout"
            )
          );

        }

      },
      15000
    );

  });

}


// ==========================================
// LOAD COUNT
// ==========================================

async function loadCount() {

  try {

    const data =
      await requestAPI({});

    updateStatus(data);

  } catch (error) {

    console.log(
      "Count error:",
      error
    );

  }

}


// ==========================================
// FORM SUBMIT
// ==========================================

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const telegramId =
      document
        .getElementById("telegramId")
        .value
        .trim();


    if (!name) {

      message.textContent =
        "Please enter your name.";

      message.className =
        "error";

      return;

    }


    if (!telegramId) {

      message.textContent =
        "Please enter your Telegram ID.";

      message.className =
        "error";

      return;

    }


    button.disabled =
      true;

    button.textContent =
      "Submitting...";

    message.textContent =
      "";


    try {

      const data =
        await requestAPI({

          name:
            name,

          telegramId:
            telegramId

        });


      if (data.success) {

        message.textContent =
          data.message;

        message.className =
          "success";


        updateStatus(data);


        form.reset();


        if (
          data.completed ||
          Number(data.count) >= 200
        ) {

          button.disabled =
            true;

          button.textContent =
            "Giveaway Complete";

        } else {

          button.disabled =
            false;

          button.textContent =
            "Submit Entry";

        }

      } else {

        message.textContent =
          data.message ||
          "Unable to submit entry.";

        message.className =
          "error";


        if (
          data.count !== undefined
        ) {

          countElement.textContent =
            data.count;

        }


        button.disabled =
          false;

        button.textContent =
          "Submit Entry";

      }


    } catch (error) {

      console.log(
        "Submit error:",
        error
      );


      message.textContent =
        "Connection error. Please try again.";

      message.className =
        "error";


      button.disabled =
        false;

      button.textContent =
        "Submit Entry";

    }

  }
);


// ==========================================
// START
// ==========================================

loadCount();

</script>
</body>
</html>
